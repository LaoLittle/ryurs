[workspace]
resolver = "2"
members = [
    "crates/ryurs-cli",
    "crates/ryurs-core",
    "crates/ryurs-dynarec",
    "crates/ryurs-gpu-wgpu",
    "crates/ryurs-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Laolittle"]

[workspace.dependencies]
ryurs-core = { path = "crates/ryurs-core" }
ryurs-dynarec = { path = "crates/ryurs-dynarec" }
ryurs-gpu-wgpu = { path = "crates/ryurs-gpu-wgpu" }
ryurs-macros = { path = "crates/ryurs-macros" }
anyhow = "1.0.102"
aes = "0.8.4"
clap = { version = "4.5.60", features = ["derive"] }
cfg-if = "1.0.4"
cranelift-codegen = "0.131.0"
cranelift-frontend = "0.131.0"
cranelift-native = "0.131.0"
core-text = "=21.0.0"
ctr = "0.9.2"
pollster = "0.4.0"
gpui = { version = "0.2.2", default-features = false, features = ["macos-blade", "font-kit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lz4_flex = "0.12.0"
libc = "0.2.182"
naga = { version = "28.0.0", features = ["termcolor"] }
object = "0.38.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
wgpu = "28.0.0"
winit = "0.30.12"
xts-mode = "0.5.1"
smallvec = "1.15.1"
page_size = "0.6.0"

[profile.app-release]
inherits = "release"
incremental = false
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[patch.crates-io]
cranelift-codegen = { git = "https://github.com/LaoLittle/wasmtime.git" }
cranelift-frontend = { git = "https://github.com/LaoLittle/wasmtime.git" }
cranelift-native = { git = "https://github.com/LaoLittle/wasmtime.git" }